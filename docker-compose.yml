services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USERNAME: payments
      DB_PASSWORD: payments
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://issuer.example.invalid}
    ports: ["8080:8080"]
